<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>remoe layout fixture</title>
  <link rel="stylesheet" href="../src/style.css">
</head>
<body class="remote-active control-active touch-control-active">
  <main>
    <section class="viewer">
      <video id="video" class="viewer-video" autoplay muted playsinline></video>
      <div id="remote-cursor" class="remote-cursor" aria-hidden="true"></div>
      <div class="remote-toolbar">
        <div class="remote-toolbar-main">
          <span id="remote-status">正在触控远程桌面</span>
          <label class="performance-toggle"><input type="checkbox"><span>性能</span></label>
          <button>断开</button>
        </div>
        <div class="mobile-controls">
          <div class="mobile-quick-actions">
            <div class="touch-mode-switch"><button class="active">触控板</button><button>直触</button></div>
            <button>键盘</button><button>更多</button><button>隐藏</button><button class="mobile-stop">断开</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script type="module">
    import { cursorViewportPosition, fitVideoSize } from '../src/core/layout.js';
    const video = document.querySelector('#video');
    const cursor = document.querySelector('#remote-cursor');
    const fitted = fitVideoSize(2560, 1440,
      document.documentElement.clientWidth, document.documentElement.clientHeight);
    video.style.width = `${fitted.width}px`;
    video.style.height = `${fitted.height}px`;
    const point = cursorViewportPosition(32768, 32768, video.getBoundingClientRect());
    cursor.style.left = `${point.left}px`;
    cursor.style.top = `${point.top}px`;
  </script>
</body>
</html>
