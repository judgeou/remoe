name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build Release
        shell: cmd
        run: build.cmd Release

      - name: Run native tests
        shell: pwsh
        run: ctest --test-dir build-local -C Release --output-on-failure

      - name: Package executables
        shell: pwsh
        run: |
          $packageDir = "dist/remoe-windows-x64"
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          Copy-Item "build-local/Release/remoe_host.exe" $packageDir
          if (Test-Path "build-local/Release/remoe_client.exe") {
            Copy-Item "build-local/Release/remoe_client.exe" $packageDir
          }
          Copy-Item "README.md" $packageDir

          Compress-Archive `
            -Path "$packageDir/*" `
            -DestinationPath "dist/remoe-windows-x64.zip" `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: remoe-windows-x64
          path: dist/remoe-windows-x64.zip
          if-no-files-found: error

  android:
    name: Build signed Android Release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REMOE_RELEASE_STORE_PASSWORD: ${{ secrets.REMOE_RELEASE_STORE_PASSWORD }}
      REMOE_RELEASE_KEY_ALIAS: ${{ secrets.REMOE_RELEASE_KEY_ALIAS }}
      REMOE_RELEASE_KEY_PASSWORD: ${{ secrets.REMOE_RELEASE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android-client

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          REMOE_RELEASE_KEYSTORE_BASE64: ${{ secrets.REMOE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$REMOE_RELEASE_KEYSTORE_BASE64" || \
                -z "$REMOE_RELEASE_STORE_PASSWORD" || \
                -z "$REMOE_RELEASE_KEY_ALIAS" || \
                -z "$REMOE_RELEASE_KEY_PASSWORD" ]]; then
            echo "Android release signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "$REMOE_RELEASE_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/remoe-release.p12"

      - name: Run unit tests and build signed Release APK
        env:
          REMOE_RELEASE_STORE_FILE: ${{ runner.temp }}/remoe-release.p12
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            dist/remoe-android-arm64-v8a-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: remoe-android-arm64-v8a-release
          path: android-client/dist/remoe-android-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/remoe-release.p12"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: remoe-windows-x64
          path: release-assets

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: remoe-android-arm64-v8a-release
          path: release-assets

      - name: Create release and upload build artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/remoe-windows-x64.zip
            release-assets/remoe-android-arm64-v8a-release.apk
          generate_release_notes: true
